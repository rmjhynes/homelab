---
apiVersion: v1
kind: Pod
metadata:
  name: freshrss
  labels:
    app: freshrss
spec:
  containers:
    - name: freshrss
      image: freshrss/freshrss:latest
      volumeMounts:
        - mountPath: /var/www/FreshRSS/data
          name: backup
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: freshrss-backup-pvc
