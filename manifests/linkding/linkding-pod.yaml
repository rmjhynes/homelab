---
apiVersion: v1
kind: Pod
metadata:
  name: linkding
  labels:
    app: linkding
spec:
  containers:
    - name: linkding
      image: sissbruecker/linkding:latest
      volumeMounts:
        - mountPath: /etc/linkding/data
          name: database
  volumes:
    - name: database
      persistentVolumeClaim:
        claimName: linkding-database-pvc
